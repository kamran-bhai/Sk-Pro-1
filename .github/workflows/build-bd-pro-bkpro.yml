name: Build BD Pro BKPro APK
on:
  workflow_dispatch:
  push:
    branches: [bd-pro-bkpro]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle -p bd-pro-bkpro :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bd-pro-bkpro-debug-apk
          path: bd-pro-bkpro/app/build/outputs/apk/debug/app-debug.apk
