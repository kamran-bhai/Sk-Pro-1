name: Build SK Pro Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Ensure Gradle Wrapper Exists
        working-directory: android-dpc
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating wrapper JAR using installed Gradle 8.7..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: android-dpc
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output
        run: |
          ls -la android-dpc/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sk-pro-debug-apk
          path: android-dpc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
