name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:

env:
  GCP_PROJECT_ID: "896573692943"
  GCP_REGION: "asia-southeast1"
  CLOUD_RUN_SERVICE: "ais-dev"

jobs:
  deploy:
    name: Deploy SK Pro backend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated

      - name: Verify health endpoint
        run: |
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"

          echo "Cloud Run URL: $SERVICE_URL"
          curl --fail --silent --show-error --max-time 30 "$SERVICE_URL/health"
          echo

      - name: Verify missing API route returns JSON
        run: |
          SERVICE_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"

          BODY="$(curl --silent --show-error --max-time 30 \
            -H 'Accept: application/json' \
            "$SERVICE_URL/api/v1/__deployment_probe__")"

          echo "$BODY"
          echo "$BODY" | grep -q '"API_ROUTE_NOT_FOUND"'
