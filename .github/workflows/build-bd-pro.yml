name: Build BD Pro Android APKs
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Admin APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Build Device Agent APK
        run: gradle :agent:assembleDebug --no-daemon
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: bd-pro-admin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Device Agent APK
        uses: actions/upload-artifact@v4
        with:
          name: bd-pro-device-agent-debug-apk
          path: agent/build/outputs/apk/debug/agent-debug.apk
